name: Factcheck events.json

# Official-source calendar validation.
# Runs daily at 22:20 UTC (= 07:20 JST), after the earnings refresh window.
# This workflow is report-first: it does not auto-edit events.json.

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: macropulse-data-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Run current-year factcheck
        run: node factcheck/factcheck.js --year "$(date -u +%Y)" --no-cache

      - name: Run current-year structural audit
        if: always()
        run: node factcheck/audit_events.js --year "$(date -u +%Y)"

      - name: Commit factcheck report if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain factcheck/reports)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add factcheck/reports
            git commit -m "factcheck(auto): events calendar report"
            git pull --rebase origin main
            git push
          else
            echo "No report changes."
          fi
