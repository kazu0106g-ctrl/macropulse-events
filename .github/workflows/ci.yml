name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --check collect_earnings.js
      - run: node --check factcheck/factcheck.js
      - run: node --check factcheck/audit_events.js
      - run: node factcheck/sources/customs_jp.test.js
