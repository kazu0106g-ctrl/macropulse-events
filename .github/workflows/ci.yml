name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --check collect_earnings.js
      - run: node collect_earnings.test.js
      - run: node --check factcheck/factcheck.js
      - run: node --check factcheck/audit_events.js
      - run: node factcheck/sources/customs_jp.test.js
      - run: node factcheck/sources/fed.test.js
