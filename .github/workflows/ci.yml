name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --check collect_earnings.js
      - run: node collect_earnings.test.js
      - run: node --check factcheck/factcheck.js
      - run: node --check factcheck/audit_events.js
      - run: node factcheck/sources/customs_jp.test.js
      - run: node factcheck/sources/fed.test.js
