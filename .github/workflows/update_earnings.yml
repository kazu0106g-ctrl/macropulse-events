name: Update earnings_dates.json

# Daily refresh of earnings_dates.json via SEC EDGAR (public domain data).
# Runs at 22:00 UTC (= 07:00 JST).
# Also runnable manually from the Actions tab.

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: macropulse-data-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node collect_earnings.js

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain earnings_dates.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add earnings_dates.json
            git commit -m "chore(auto): daily refresh earnings_dates.json"
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
